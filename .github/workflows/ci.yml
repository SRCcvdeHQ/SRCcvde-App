name: Checks
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:functions
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://pszxarjungpoqvbwoblf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cedTLNmaS7EyedW--HEQzw_tpDXQAsp
