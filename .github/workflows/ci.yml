name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://pszxarjungpoqvbwoblf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cedTLNmaS7EyedW--HEQzw_tpDXQAsp
